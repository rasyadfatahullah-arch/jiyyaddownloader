<style>
:root{
  --bg:#08080d;
  --card:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.1);
  --text:#f2f4f8;
  --muted:#8b92a8;
  --a:#22d3ee;
  --b:#8b5cf6;
  --wa:#25d366;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(50% 40% at 15% 0%,rgba(139,92,246,.22),transparent 70%),
    radial-gradient(45% 40% at 90% 100%,rgba(34,211,238,.16),transparent 70%);
}
#fx{position:fixed;inset:0;z-index:300;pointer-events:none}
.grad{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== Layar loading ===== */
.intro{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);
  transition:opacity .6s,visibility .6s;
}
.intro.done{opacity:0;visibility:hidden}
.intro-in{width:min(320px,80vw);text-align:center}
.intro h1{font-family:'Space Grotesk',sans-serif;font-size:32px;letter-spacing:6px;font-weight:700;animation:fadeUp .8s both}
.intro small{display:block;margin-top:6px;font-size:12px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;animation:fadeUp .8s .15s both}
.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);margin:34px 0 14px;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 14px var(--a)}
.pct{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.pct span{font-size:20px;color:var(--muted)}
.status{margin-top:4px;font-size:12px;color:var(--muted);min-height:16px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}

/* ===== Popup saluran WA ===== */
.overlay{
  position:fixed;inset:0;z-index:150;display:none;place-items:center;padding:18px;
  background:rgba(4,4,8,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.overlay.show{display:grid;animation:fade .4s}
.overlay.hide{animation:fadeOut .35s forwards}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.popup{
  width:100%;max-width:360px;text-align:center;padding:26px 20px 22px;border-radius:28px;
  background:linear-gradient(160deg,#12121c,#0b0b12);border:1px solid var(--line);
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(139,92,246,.18);
}
.overlay.show .popup{animation:popIn .7s cubic-bezier(.17,1.1,.3,1.25) both}
.overlay.hide .popup{animation:popOut .3s forwards}
@keyframes popIn{0%{opacity:0;transform:scale(.3) translateY(60px)}100%{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:scale(.7) translateY(30px)}}
.popup h2{font-family:'Space Grotesk',sans-serif;font-size:22px;letter-spacing:3px}
.popup p{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.55}

.orbit-wrap{position:relative;width:260px;height:260px;margin:14px auto 6px}
.orbit{position:absolute;inset:0;animation:spin 16s linear infinite}
.orbit::before{ /* cincin tipis */
  content:"";position:absolute;inset:34px;border-radius:50%;border:1px dashed rgba(255,255,255,.14);
}
.slot{
  position:absolute;left:50%;top:50%;width:0;height:0;
  transform:rotate(var(--a)) translateX(98px) rotate(calc(-1 * var(--a)));
}
.counter{animation:spin 16s linear infinite reverse}
.pf{
  position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:#14141f;border:1px solid var(--c);color:var(--c);box-shadow:0 0 16px -2px var(--c);
  opacity:0;animation:iconPop .6s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:calc(.3s + var(--i)*.12s);
}
.pf svg{width:21px;height:21px;fill:currentColor}
@keyframes iconPop{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.wa{
  position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
  display:grid;place-items:center;text-decoration:none;color:#fff;cursor:pointer;border:none;overflow:hidden;
  background:var(--wa);box-shadow:0 0 0 0 rgba(37,211,102,.6),0 10px 30px rgba(37,211,102,.4);
  animation:waPulse 2s infinite;transition:transform .15s;
}
.wa:active{transform:scale(.92)}
.wa svg{width:46px;height:46px;fill:#fff;pointer-events:none}
@keyframes waPulse{70%{box-shadow:0 0 0 22px rgba(37,211,102,0),0 10px 30px rgba(37,211,102,.4)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0),0 10px 30px rgba(37,211,102,.4)}}
.join-label{font-weight:600;font-size:15px;margin-top:2px}
.skip{
  margin-top:14px;background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:13px;
  padding:10px 20px;border-radius:12px;cursor:pointer;transition:.2s;
}
.skip:hover{color:var(--text);border-color:rgba(255,255,255,.3)}

/* ===== Halaman utama ===== */
.wrap{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:46px 18px 60px}
header{text-align:center;margin-bottom:28px}
.brand{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,7vw,40px);letter-spacing:5px;font-weight:700}
.tag{margin-top:6px;font-size:13px;color:var(--muted)}
.icons{display:flex;justify-content:center;gap:10px;margin:20px 0 26px}
.icons .pf{position:static;opacity:1;animation:none;width:42px;height:42px;border-color:var(--line);box-shadow:none;color:var(--muted);transition:.25s}
.icons .pf:hover{color:var(--c);border-color:var(--c);box-shadow:0 0 18px -4px var(--c);transform:translateY(-3px)}

.card{padding:20px;border-radius:22px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.field{display:flex;gap:10px}
.field input{
  flex:1;min-width:0;padding:15px 16px;border-radius:14px;font:inherit;font-size:15px;color:#fff;
  background:rgba(0,0,0,.4);border:1px solid var(--line);outline:none;transition:.2s;
}
.field input::placeholder{color:#5d647a}
.field input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(34,211,238,.14)}
.paste{padding:0 16px;border-radius:14px;font:inherit;font-size:13px;font-weight:600;color:var(--a);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.35);cursor:pointer;position:relative;overflow:hidden}
.btn{
  position:relative;overflow:hidden;width:100%;margin-top:12px;padding:15px;border:none;border-radius:14px;cursor:pointer;
  font:inherit;font-weight:600;font-size:15px;letter-spacing:1px;color:#06060a;
  background:linear-gradient(90deg,var(--a),var(--b));
  box-shadow:0 8px 28px -8px rgba(139,92,246,.7);transition:transform .15s,box-shadow .2s,filter .2s;
}
.btn:hover{filter:brightness(1.1);box-shadow:0 10px 34px -6px rgba(34,211,238,.6)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.65;cursor:progress}
.btn.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}

.loader{display:none;margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
.loader.show{display:block}
.ring{width:34px;height:34px;margin:0 auto 8px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:var(--a);animation:spin .8s linear infinite}
.error{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;color:#fecdd3;background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.4)}
.error.show{display:block;animation:fadeUp .3s}
.result{display:none;margin-top:18px;animation:fadeUp .45s}
.result.show{display:block}
.rcard{border-radius:16px;overflow:hidden;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.thumb{width:100%;max-height:280px;object-fit:cover;display:block;background:#0d0d16}
.rbody{padding:14px}
.rtitle{font-weight:600;font-size:15px;line-height:1.45;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rauthor{margin-top:4px;font-size:12px;color:var(--a)}
.dls{display:grid;gap:8px;margin-top:12px}
.dl{
  position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:13px 15px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:500;font-size:14px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.2s;
}
.dl:hover{border-color:var(--a);background:rgba(34,211,238,.07)}
.dl:active{transform:scale(.98)}
.dl svg{width:18px;height:18px;fill:var(--a)}
footer{margin-top:34px;text-align:center;font-size:12px;color:var(--muted);line-height:1.8}
footer b{font-family:'Space Grotesk',sans-serif;letter-spacing:2px;color:var(--text)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<script>
(function(){
  /* ===== Partikel saat tombol ditekan ===== */
  var cv = document.getElementById('fx'), cx = cv.getContext('2d'), parts = [], running = false;
  function size(){ cv.width = innerWidth; cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  var COLORS = ['#22d3ee','#8b5cf6','#ffffff','#25d366','#f0abfc'];

  function burst(x, y, n){
    for (var i = 0; i < n; i++){
      var a = Math.random() * 6.283, s = 2 + Math.random() * 6;
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.2,life:1,decay:.014+Math.random()*.02,r:1.6+Math.random()*3,c:COLORS[(Math.random()*COLORS.length)|0]});
    }
    if (!running){ running = true; requestAnimationFrame(loop); }
  }
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    cx.globalCompositeOperation = 'lighter';
    for (var i = parts.length-1; i >= 0; i--){
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += .13; p.vx *= .99; p.life -= p.decay;
      if (p.life <= 0){ parts.splice(i,1); continue; }
      cx.globalAlpha = p.life; cx.shadowBlur = 12; cx.shadowColor = p.c; cx.fillStyle = p.c;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    }
    cx.globalAlpha = 1; cx.shadowBlur = 0;
    if (parts.length) requestAnimationFrame(loop); else { running = false; cx.clearRect(0,0,cv.width,cv.height); }
  }
  function btnFx(btn, e){
    var r = btn.getBoundingClientRect();
    var px = e && e.clientX ? e.clientX : r.left + r.width/2;
    var py = e && e.clientY ? e.clientY : r.top + r.height/2;
    var d = Math.max(r.width, r.height) * 2;
    var rp = document.createElement('span');
    rp.className = 'ripple';
    rp.style.cssText = 'width:'+d+'px;height:'+d+'px;left:'+(px-r.left-d/2)+'px;top:'+(py-r.top-d/2)+'px';
    btn.appendChild(rp); setTimeout(function(){ rp.remove(); }, 650);
    burst(px, py, 38);
    if (navigator.vibrate) navigator.vibrate(20);
  }
  document.addEventListener('pointerdown', function(e){
    var b = e.target.closest('.fxbtn, .dl, .skip');
    if (b) btnFx(b, e);
  });

  /* ===== Loading progres -> popup ===== */
  var intro = document.getElementById('intro'),
      overlay = document.getElementById('overlay'),
      fill = document.getElementById('fill'),
      pct = document.getElementById('pct'),
      status = document.getElementById('status');
  var steps = [[0,'Menyiapkan...'],[30,'Memuat tampilan...'],[60,'Menghubungkan server...'],[90,'Hampir selesai...'],[100,'Selesai!']];
  var val = 0, start = performance.now(), DURATION = 2800;

  function tick(now){
    var t = Math.min((now - start) / DURATION, 1);
    var eased = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;   // easeInOutQuad
    val = Math.round(eased * 100);
    fill.style.width = val + '%';
    pct.textContent = val;
    for (var i = steps.length-1; i >= 0; i--){ if (val >= steps[i][0]){ status.textContent = steps[i][1]; break; } }
    if (t < 1) requestAnimationFrame(tick);
    else {
      setTimeout(function(){
        intro.classList.add('done');
        overlay.classList.add('show');
        setTimeout(function(){ burst(innerWidth/2, innerHeight/2, 60); }, 500);
        setTimeout(function(){ intro.remove(); }, 700);
      }, 450);
    }
  }
  requestAnimationFrame(tick);

  function closePopup(){
    overlay.classList.add('hide');
    setTimeout(function(){ overlay.remove(); }, 350);
  }
  document.getElementById('skipBtn').addEventListener('click', function(){ setTimeout(closePopup, 250); });
  document.getElementById('waBtn').addEventListener('click', function(){ setTimeout(closePopup, 600); });

  /* ===== Downloader ===== */
  var form = document.getElementById('form'), input = document.getElementById('url'),
      goBtn = document.getElementById('goBtn'), loader = document.getElementById('loader'),
      errBox = document.getElementById('error'), result = document.getElementById('result'),
      thumb = document.getElementById('thumb'), rtitle = document.getElementById('rtitle'),
      rauthor = document.getElementById('rauthor'), dls = document.getElementById('dls');

  document.getElementById('pasteBtn').addEventListener('click', async function(){
    try { var t = await navigator.clipboard.readText(); if (t) input.value = t.trim(); }
    catch(e){ input.focus(); }
  });

  function showError(msg){
    errBox.textContent = msg; errBox.classList.add('show');
    goBtn.classList.remove('shake'); void goBtn.offsetWidth; goBtn.classList.add('shake');
  }

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    var link = input.value.trim();
    errBox.classList.remove('show'); result.classList.remove('show');
    if (!link) return;
    goBtn.disabled = true; loader.classList.add('show');
    try {
      var res = await fetch('/api/download?url=' + encodeURIComponent(link));
      var data = await res.json().catch(function(){ return null; });
      if (!res.ok || !data || !data.ok) throw new Error((data && data.error) || 'Gagal mengambil video.');

      rtitle.textContent = data.title || 'Video siap diunduh';
      rauthor.textContent = data.author ? '@' + String(data.author).replace(/^@/, '') : '';
      if (data.thumbnail){ thumb.referrerPolicy = 'no-referrer'; thumb.src = data.thumbnail; thumb.hidden = false; }
      else thumb.hidden = true;

      dls.innerHTML = '';
      data.links.forEach(function(l){
        var a = document.createElement('a');
        a.className = 'dl'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.setAttribute('download','');
        a.innerHTML = '<span></span><svg viewBox="0 0 24 24"><use href="#i-dl"/></svg>';
        a.firstChild.textContent = l.label;
        dls.appendChild(a);
      });
      result.classList.add('show');
      var r = goBtn.getBoundingClientRect();
      burst(r.left + r.width/2, r.top, 46);
      setTimeout(function(){ result.scrollIntoView({behavior:'smooth', block:'center'}); }, 150);
    } catch(err){
      showError(err.message || 'Terjadi kesalahan.');
    } finally {
      loader.classList.remove('show'); goBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
